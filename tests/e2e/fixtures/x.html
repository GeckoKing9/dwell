<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>X fixture</title>
    <script>
      // Runs after the guard (document_start) and before first paint: records the hash it found.
      document.documentElement.dataset.hashAtHead = location.hash;
    </script>
  </head>
  <body>
    <main data-shown="">
      <a id="open-video" href="/someuser/status/123/video/1">Open a video</a>
      <a id="open-photo" href="/someuser/status/123/photo/1">Open a photo</a>
    </main>
    <script>
      // The site's own router. Like a real single-page app it draws the route it was asked for, whatever
      // the URL ends up being, and draws the URL's route again on Back and Forward.
      const screen = document.querySelector('main');
      function show(path) {
        screen.dataset.shown = path;
      }
      window.router = {
        push(path) {
          history.pushState({}, '', path);
          show(path);
        },
        replace(path) {
          history.replaceState({}, '', path);
          show(path);
        },
      };
      window.addEventListener('popstate', () => show(location.pathname));
      show(location.pathname);
      // An in-page route change, like a video tapped in the timeline.
      for (const id of ['open-video', 'open-photo']) {
        const link = document.getElementById(id);
        link.addEventListener('click', (event) => {
          event.preventDefault();
          window.router.push(link.getAttribute('href'));
        });
      }
    </script>
  </body>
</html>
