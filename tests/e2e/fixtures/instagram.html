<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Instagram fixture</title>
    <script>
      // Runs after the guard (document_start) and before first paint: records the hash it found.
      document.documentElement.dataset.hashAtHead = location.hash;
    </script>
    <style>
      [role='dialog'] {
        position: fixed;
        inset: 40px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Primary">
      <a id="nav-home" href="/">Home</a>
      <a id="nav-reels" href="/reels/">Reels</a>
    </nav>
    <main>
      <a id="open-reel" href="/reel/DeewiSPpCrm/">Open a reel</a>
      <a id="open-user-reel" href="/someuser/reel/DeewiSPpCrm/">Open a reel from a profile</a>
      <a id="open-reels-code" href="/reels/DeewiSPpCrm/">Open the Reels scroller on one reel</a>
      <a id="open-feed" href="/reels/">Open the Reels feed</a>
      <a id="profile-reels" href="/someone/reels/">Profile reels</a>
      <video id="clip" muted playsinline width="32" height="32"></video>
      <div id="grid">
        <a id="tile-1" href="/p/AAAAA1/">post one</a>
        <a id="tile-2" href="/p/BBBBB2/">post two</a>
        <a id="tile-3" href="/reel/CCCCC3/">reel three</a>
        <a id="tile-4" href="/p/DDDDD4/">post four</a>
      </div>
      <div id="search-grid">
        <!-- Instagram sends a Reel tapped in search to its Reels feed, whatever the tile's own address. -->
        <a id="search-reel" href="/reel/EEEEE5/" data-opens="/reels/EEEEE5/">search reel</a>
        <a id="search-post" href="/p/GGGGG7/">search post</a>
      </div>
    </main>
    <script>
      // The site's own router: every link in the page is an in-page route change. A post or a single
      // reel opens in a pop-up over the page you were on, as Instagram does.
      function openDialog() {
        const dialog = document.createElement('div');
        dialog.setAttribute('role', 'dialog');
        const video = document.createElement('video');
        video.muted = true;
        video.width = 32;
        video.height = 32;
        dialog.append(video);
        document.body.append(dialog);
      }
      // Like Instagram's router, it records the route of every history entry, and records a navigation even
      // when the browser cancelled its address change (against the entry still on screen). On Back it puts
      // back the route it recorded for the entry, by a replace.
      const routes = { initial: location.pathname };
      let keys = 0;
      const entryKey = () => (history.state && history.state.key) || 'initial';
      window.navigateTo = (path, replace) => {
        const key = replace ? entryKey() : `k${(keys += 1)}`;
        if (replace) history.replaceState({ key }, '', path);
        else history.pushState({ key }, '', path);
        routes[location.pathname === path ? key : entryKey()] = path;
      };
      window.addEventListener('popstate', () => {
        const recorded = routes[entryKey()];
        if (recorded !== undefined && recorded !== location.pathname) history.replaceState(history.state, '', recorded);
      });
      for (const link of document.querySelectorAll('main a')) {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          window.siteHandledTap = true;
          const href = link.dataset.opens ?? link.getAttribute('href');
          window.navigateTo(href, false);
          if (/^\/(?:[^/]+\/)?(?:p|reel)\//.test(href)) openDialog();
        });
      }
    </script>
  </body>
</html>
