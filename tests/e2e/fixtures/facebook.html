<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Facebook reel viewer fixture</title>
    <script>
      // Runs after the guard (document_start) and before first paint: records the hash it found.
      document.documentElement.dataset.hashAtHead = location.hash;
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      #viewer {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
      }
      .clip {
        height: 100vh;
        scroll-snap-align: start;
      }
      #comments {
        position: fixed;
        top: 0;
        right: 0;
        width: 240px;
        height: 200px;
        overflow-y: auto;
        background: #fff;
      }
      #comments-body {
        height: 1000px;
      }
    </style>
  </head>
  <body>
    <div id="viewer" data-shown="">
      <div id="next-card" role="button" aria-label="Next Card">next</div>
      <div id="previous-card" role="button" aria-label="Previous Card">previous</div>
      <div class="clip">reel one</div>
      <div class="clip">reel two</div>
    </div>
    <aside id="comments"><div id="comments-body">comments</div></aside>
    <div id="left-column">
      <ul>
        <li id="left-reels"><div><a href="/reel/">Reels</a></div></li>
        <li id="left-friends"><div><a href="/friends/">Friends</a></div></li>
      </ul>
    </div>
    <div role="feed">
      <div id="feed-reels-unit">
        <div><span>Reels</span></div>
        <div><a href="/reel/?s=see_more">See more</a></div>
      </div>
      <div id="feed-post">
        <div><a href="/someone/posts/1">A post</a></div>
      </div>
    </div>
    <script>
      // What the page itself hears: an event the guard swallows never reaches these listeners.
      window.heard = [];
      document.addEventListener(
        'wheel',
        (event) => window.heard.push(`wheel:${event.target.closest('#comments') ? 'comments' : 'viewer'}`),
        { passive: true },
      );
      document.addEventListener('keydown', (event) => window.heard.push(`key:${event.key}`));
      // A key listener the page adds on window, capture phase, after the guard started.
      window.heardOnWindow = [];
      window.addEventListener('keydown', (event) => window.heardOnWindow.push(event.key), true);

      // The site's own router. Like a real single-page app it draws the route it was asked for, whatever
      // the URL ends up being (a cancelled push leaves the old URL under the new reel), and draws the
      // URL's route again on Back and Forward.
      const viewer = document.getElementById('viewer');
      function show(path) {
        const reel = /^\/reel\/(\d+)/.exec(path);
        viewer.dataset.shown = reel === null ? path : reel[1];
      }
      window.router = {
        push(path) {
          history.pushState({}, '', path);
          show(path);
        },
        replace(path) {
          history.replaceState({}, '', path);
          show(path);
        },
      };
      window.addEventListener('popstate', () => show(location.pathname));
      // The viewer's own card buttons, as measured on Facebook: each replaces the address with the next or the
      // previous reel, and Previous does nothing on the first card, the reel the viewer opened on.
      const firstReel = Number(/^\/reel\/(\d+)/.exec(location.pathname)?.[1] ?? 0);
      function moveCard(step) {
        const reel = Number(/^\/reel\/(\d+)/.exec(location.pathname)?.[1] ?? firstReel) + step * firstReel;
        if (firstReel > 0 && reel >= firstReel) window.router.replace(`/reel/${reel}`);
      }
      document.getElementById('next-card').addEventListener('click', () => moveCard(1));
      document.getElementById('previous-card').addEventListener('click', () => moveCard(-1));
      show(location.pathname);
    </script>
  </body>
</html>
