<style>
/* Layout: one quiet column of facts; charts sit in channels of time-dots (the single motif). */
:root {
  --page: #EDF0F0;
  --surface: #FBFCFC;
  --surface-2: #E3E8E8;
  --surface-3: #FFFFFF;
  --ink: #131D1F;
  --ink-2: #465355;
  --ink-3: #5B6869;
  --bar: #78878A;
  --bar-hover: #5A696B;
  --accent: #0E877D;
  --accent-text: #0A6B63;
  --accent-wash: rgba(14, 135, 125, 0.12);
  --dot: #B9C3C3;
  --dot-faint: #D7DEDE;
  --rule: #D6DDDD;
  --edge: rgba(19, 29, 31, 0.10);
  --top-light: rgba(255, 255, 255, 0);
  --pop-shadow: 0 14px 36px rgba(19, 29, 31, 0.16), 0 2px 6px rgba(19, 29, 31, 0.08);
  --card-shadow: 0 1px 2px rgba(19, 29, 31, 0.05);
  --inverse-bg: #131D1F;
  --inverse-fg: #FBFCFC;
  --inverse-btn: rgba(251, 252, 252, 0.16);
  --stage: #DCE2E2;
  --stage-ink: #3E4A4C;

  --f-sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t-11: 0.6875rem; --t-12: 0.75rem; --t-13: 0.8125rem; --t-14: 0.875rem; --t-16: 1rem;
  --t-20: 1.25rem; --t-28: 1.75rem; --t-44: 2.75rem; --t-56: 3.5rem;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px;
  --r-mark: 4px; --r-ctl: 6px; --r-well: 8px; --r-card: 14px; --r-pill: 999px;
  --dot-track: radial-gradient(circle at center, var(--dot) 0 1px, transparent 1.4px) 0 50% / 6px 4px repeat-x;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0E1314; --surface: #161D1E; --surface-2: #1E2728; --surface-3: #273133;
    --ink: #E4ECEB; --ink-2: #AAB7B5; --ink-3: #8D9B99;
    --bar: #6C7B7A; --bar-hover: #8E9D9C;
    --accent: #35B8A9; --accent-text: #56CDBF; --accent-wash: rgba(53, 184, 169, 0.15);
    --dot: #3A4647; --dot-faint: #263031; --rule: #263031;
    --edge: rgba(255, 255, 255, 0.05); --top-light: rgba(255, 255, 255, 0.07);
    --pop-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
    --card-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    --inverse-bg: #E4ECEB; --inverse-fg: #0E1314; --inverse-btn: rgba(14, 19, 20, 0.12);
    --stage: #080B0C; --stage-ink: #AAB7B5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0E1314; --surface: #161D1E; --surface-2: #1E2728; --surface-3: #273133;
  --ink: #E4ECEB; --ink-2: #AAB7B5; --ink-3: #8D9B99;
  --bar: #6C7B7A; --bar-hover: #8E9D9C;
  --accent: #35B8A9; --accent-text: #56CDBF; --accent-wash: rgba(53, 184, 169, 0.15);
  --dot: #3A4647; --dot-faint: #263031; --rule: #263031;
  --edge: rgba(255, 255, 255, 0.05); --top-light: rgba(255, 255, 255, 0.07);
  --pop-shadow: 0 18px 44px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
  --card-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
  --inverse-bg: #E4ECEB; --inverse-fg: #0E1314; --inverse-btn: rgba(14, 19, 20, 0.12);
  --stage: #080B0C; --stage-ink: #AAB7B5;
  color-scheme: dark;
}

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font-family: var(--f-sans); font-size: var(--t-14); line-height: 1.45;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
[hidden] { display: none !important; }
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-ctl); }
.mono { font-family: var(--f-mono); font-size: 0.94em; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Stage (prototype harness only) ---------- */
.stage-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-4);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--stage); color: var(--stage-ink); font-size: var(--t-12);
  border-bottom: 1px solid var(--edge);
}
.stage-bar .stage-label { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: var(--t-11); }
.stage-group { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; min-width: 0; }
.stage-seed { margin-left: auto; display: flex; gap: var(--s-2); align-items: center; }
.stage {
  min-height: calc(100vh - 52px); display: flex; justify-content: center; align-items: flex-start;
  padding-block: var(--s-6) var(--s-7);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--stage);
}
.browser { width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: flex-end; }
.toolbar {
  width: 100%; display: flex; align-items: center; gap: var(--s-2); padding: 8px 10px;
  background: var(--surface); border-radius: var(--r-card) var(--r-card) 0 0; border: 1px solid var(--edge);
  box-shadow: inset 0 1px 0 var(--top-light);
}
.omnibox {
  flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; padding: 0 12px;
  border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-2);
  font-family: var(--f-mono); font-size: var(--t-12); overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.ext-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: var(--r-ctl); background: var(--accent-wash); }
.popup-anchor { margin-top: 6px; margin-right: 4px; max-width: 100%; }
@media (max-width: 400px) {
  .stage { padding-left: 0; padding-right: 0; }
  .toolbar { border-radius: 0; }
  .popup-anchor { margin-right: 0; }
}

/* ---------- Segmented control + switch (shared) ---------- */
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-well); background: var(--surface-2); flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; padding: 4px 10px; border-radius: var(--r-ctl);
  color: var(--ink-2); font-size: var(--t-12); font-weight: 500; white-space: nowrap;
}
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] {
  background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--edge), inset 0 1px 0 var(--top-light);
}
.switch {
  position: relative; flex: none; width: 36px; height: 22px; border-radius: var(--r-pill); border: 0; padding: 0;
  background: var(--bar); transition: background 160ms ease;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface-3); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 160ms ease;
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--edge); border-radius: var(--r-ctl);
  padding: 6px 12px; background: var(--surface-2); color: var(--ink); font-weight: 500; font-size: var(--t-13);
  box-shadow: inset 0 1px 0 var(--top-light);
}
.btn:hover { border-color: var(--bar); }
.btn[disabled] { cursor: default; color: var(--ink-3); border-color: transparent; background: transparent; }
.btn-quiet { background: transparent; border-color: transparent; box-shadow: none; color: var(--accent-text); padding-inline: 6px; }
.btn-quiet:hover { border-color: transparent; background: var(--accent-wash); }

/* ---------- Shared marks ---------- */
.mark {
  flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-wash); color: var(--ink); font-size: var(--t-11); font-weight: 600; line-height: 1;
}
.track { position: relative; height: 4px; background: var(--dot-track); }
.track > i { position: absolute; inset: 0 auto 0 0; display: block; background: var(--bar); border-radius: 0 2px 2px 0; }
.track.is-accent > i { background: var(--accent); }
.unit { font-size: 0.56em; font-weight: 500; color: var(--ink-2); margin-left: 0.06em; margin-right: 0.22em; letter-spacing: 0; }
.unit:last-child { margin-right: 0; }
.chip {
  display: inline-block; padding: 1px 8px; border-radius: var(--r-pill); border: 1px solid var(--rule);
  font-size: var(--t-11); color: var(--ink-2); white-space: nowrap; line-height: 1.6;
}
.wordmark { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; letter-spacing: -0.01em; font-size: var(--t-14); }
.wordmark svg { display: block; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; overflow: visible; }
.chart-wrap .hit { cursor: pointer; outline: none; }
.chart-wrap .hit:focus-visible + .focus-ring { stroke: var(--accent); }
.tip {
  position: absolute; z-index: 5; pointer-events: none; min-width: 180px; max-width: 240px;
  padding: 10px 12px; border-radius: var(--r-well); background: var(--surface-3); color: var(--ink);
  box-shadow: var(--pop-shadow), inset 0 1px 0 var(--top-light); border: 1px solid var(--edge); font-size: var(--t-12);
}
.tip-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 6px; }
.tip-head strong { font-size: var(--t-14); font-weight: 650; }
.tip-row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.tip-row span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip-foot { margin-top: 6px; color: var(--ink-3); }

/* ---------- Popup ---------- */
.popup {
  width: 360px; max-width: 100%; height: 560px; display: flex; flex-direction: column;
  background: var(--surface); color: var(--ink); border-radius: var(--r-well); overflow: hidden;
  box-shadow: var(--pop-shadow), inset 0 1px 0 var(--top-light); border: 1px solid var(--edge);
}
.pp-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 12px; }
.pp-hero .label { display: flex; justify-content: space-between; gap: 8px; font-size: var(--t-12); color: var(--ink-2); font-weight: 500; }
.pp-hero .label .date { color: var(--ink-3); font-weight: 400; }
.hero-num { display: block; font-size: 2.5rem; font-weight: 400; letter-spacing: -0.03em; line-height: 1.05; margin-top: 2px; }
.hero-num.is-quiet { color: var(--ink-2); }
.pp-compare { margin-top: 6px; color: var(--ink-2); font-size: var(--t-13); line-height: 1.4; }
.pp-compare b { color: var(--ink); font-weight: 600; }
.pp-section-title { font-size: var(--t-12); font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.site-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.site-row + .site-row { margin-top: 8px; }
.site-row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-mono); font-size: var(--t-13); }
.site-row .time { font-variant-numeric: tabular-nums; font-size: var(--t-13); font-weight: 500; }
.site-row .track { grid-column: 2 / 4; }
.empty-note { color: var(--ink-2); font-size: var(--t-13); line-height: 1.45; }
.pp-site { border-radius: var(--r-well); background: var(--surface-2); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pp-site-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pp-site-top .meta { min-width: 0; flex: 1; }
.pp-site-top .dom { font-family: var(--f-mono); font-size: var(--t-13); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-site-top .facts { font-size: var(--t-12); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pp-site-top .facts-r { flex: none; max-width: 55%; text-align: right; font-size: var(--t-13); font-weight: 500; font-variant-numeric: tabular-nums; }
.pp-site-top .facts-r span { display: block; font-size: var(--t-12); font-weight: 400; color: var(--ink-2); }
.pp-site-label { font-size: var(--t-11); color: var(--ink-3); font-weight: 500; letter-spacing: 0.02em; }
.blocker-row { display: flex; align-items: center; gap: 12px; padding-top: 8px; border-top: 1px solid var(--rule); }
.blocker-row .txt { flex: 1; min-width: 0; }
.blocker-row .state { font-weight: 650; font-size: var(--t-14); }
.blocker-row .sub { font-size: var(--t-12); color: var(--ink-2); }
.pp-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 6px 12px 6px 8px; border-top: 1px solid var(--rule); background: var(--surface);
}
.pause-ctl { display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-13); color: var(--ink-2); }
.pp-paused {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 16px; background: var(--inverse-bg); color: var(--inverse-fg);
}
.pp-paused .txt { flex: 1; min-width: 0; }
.pp-paused strong { display: block; font-size: var(--t-14); font-weight: 650; }
.pp-paused .txt span { font-size: var(--t-12); }
.pp-paused button { border: 0; border-radius: var(--r-ctl); padding: 6px 12px; background: var(--inverse-btn); color: var(--inverse-fg); font-weight: 600; font-size: var(--t-13); }
.popup.is-paused .pp-foot { background: var(--surface-2); }

/* ---------- Dashboard ---------- */
.dash { background: var(--page); min-height: 100%; }
.dash-top {
  display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1280px; margin: 0 auto;
}
.dash-top nav { display: flex; gap: 2px; flex-wrap: wrap; }
.dash-top nav button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: var(--r-ctl); color: var(--ink-2); font-weight: 500;
}
.dash-top nav button[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.dash-top nav button:hover { color: var(--ink); }
.status-pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-12); color: var(--ink-2); }
.status-pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.status-pill.is-paused { background: var(--inverse-bg); color: var(--inverse-fg); padding: 3px 10px; border-radius: var(--r-pill); font-weight: 600; }
.status-pill.is-paused .led { background: var(--inverse-fg); border-radius: 1px; width: 8px; height: 8px; }
.dash-main {
  max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-5);
  padding-block: var(--s-2) var(--s-7);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.weeknav { display: flex; align-items: center; gap: var(--s-2); flex-wrap: wrap; }
.weeknav .range { font-size: var(--t-20); font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.weeknav .rel { font-size: var(--t-12); color: var(--ink-2); padding: 2px 8px; border-radius: var(--r-pill); background: var(--surface-2); }
.icon-btn {
  width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-ctl);
  border: 1px solid var(--edge); background: var(--surface); color: var(--ink);
}
.icon-btn[disabled] { color: var(--dot); cursor: default; background: transparent; }
.headline { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s-4) var(--s-7); }
.stat .label { font-size: var(--t-12); color: var(--ink-2); font-weight: 500; }
.stat .value { font-size: var(--t-28); font-weight: 450; letter-spacing: -0.02em; line-height: 1.15; }
.stat.is-hero .value { font-size: var(--t-56); font-weight: 350; letter-spacing: -0.035em; line-height: 1; }
.headline-notes { flex: 1 1 280px; min-width: 0; color: var(--ink-2); font-size: var(--t-14); max-width: 34rem; }
.headline-notes p + p { margin-top: 4px; }
.headline-notes b { color: var(--ink); font-weight: 600; }
.grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--s-5); align-items: start; }
@media (max-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel {
  background: var(--surface); border-radius: var(--r-card); padding: var(--s-5); min-width: 0;
  border: 1px solid var(--edge); box-shadow: var(--card-shadow), inset 0 1px 0 var(--top-light);
}
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: var(--s-4); }
.panel-head h2 { font-size: var(--t-16); }
.panel-head .aside { font-size: var(--t-12); color: var(--ink-3); }
.legend-note { font-size: var(--t-12); color: var(--ink-3); margin-top: var(--s-2); }
.cat-row { display: grid; grid-template-columns: minmax(64px, auto) minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.cat-row + .cat-row { margin-top: 12px; }
.cat-row .n { font-size: var(--t-13); font-weight: 500; }
.cat-row .v { font-size: var(--t-13); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.cat-row .v span { color: var(--ink-3); margin-left: 6px; }
.blk-total { display: flex; align-items: baseline; gap: 10px; }
.blk-total .n { font-size: var(--t-28); font-weight: 450; }
.blk-total p { color: var(--ink-2); font-size: var(--t-13); }
.blk-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--rule); }
.blk-row .n { font-size: var(--t-13); }
.blk-row .c { font-variant-numeric: tabular-nums; font-weight: 600; }
.blk-dots { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; min-height: 6px; }
.blk-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--bar); display: block; }
.blk-note { margin-top: var(--s-4); font-size: var(--t-12); color: var(--ink-3); }

/* Most used list */
.mu { container-type: inline-size; }
.mu-row {
  display: grid; align-items: center; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--rule);
  grid-template-columns: 18px 24px minmax(0, 1fr) 76px 64px 44px 64px 52px;
}
.mu-row.is-head { border-top: 0; padding: 0 0 6px; font-size: var(--t-11); color: var(--ink-3); font-weight: 500; }
.mu-row .rank { font-size: var(--t-11); color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: right; }
.mu-row .site { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.mu-row .site .d { font-family: var(--f-mono); font-size: var(--t-13); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mu-row .t, .mu-row .sh, .mu-row .dl, .mu-row .vi { font-variant-numeric: tabular-nums; text-align: right; font-size: var(--t-13); white-space: nowrap; }
.mu-row .t { font-weight: 600; }
.mu-row .sh, .mu-row .vi { color: var(--ink-2); }

  const input = h('input', { class: 'field', id: 'ignore-input', type: 'text', placeholder: 'example.com', 'aria-label': t('sIgnore'), autocomplete: 'off', spellcheck: 'false' });
  const addIgnore = () => {
    const v = input.value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/.*$/, '');
    if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(v)) S.ignoreErr = t('badDomain');
    else if (s.ignore.includes(v)) S.ignoreErr = t('already', { d: v });
    else { s.ignore.push(v); S.ignoreErr = ''; bump(); }
    render(); const f = document.getElementById('ignore-input'); if (f) f.focus();
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addIgnore(); });
  const chips = h('div', { class: 'chips' }, ...s.ignore.map(d => h('span', { class: 'chip-x' }, d, h('button', { 'aria-label': t('remove', { d }), onclick: () => { s.ignore = s.ignore.filter(x => x !== d); bump(); render(); } }, '×'))));
  si.append(setRow(t('sIgnore'), t('sIgnoreDesc'), [input, h('button', { class: 'btn', onclick: addIgnore }, t('add'))], h('div', { style: 'display:flex;flex-direction:column;gap:6px;width:100%' }, S.ignoreErr ? h('p', { class: 'field-err', role: 'alert', text: S.ignoreErr }) : null, chips)));
  const domains = [...new Set(DB.flatMap(d => d.hours.flatMap(hh => Object.keys(hh))))].sort();
  const ed = h('div', { class: 'cat-editor' }, ...domains.map(d => {
    const sel = h('select', { class: 'field', 'aria-label': d, onchange: e => { s.cats[d] = e.target.value; bump(); } }, ...CATS.map(c => h('option', { value: c, selected: catOf(d) === c ? true : null }, t('cat_' + c))));
    return h('label', {}, h('span', { class: 'd', text: d }), sel);
  }));
  si.append(setRow(t('sCats'), t('sCatsDesc'), null, ed));
  const da = grp('set-data', 'sData');
  da.append(setRow(t('sRetention'), t('sRetentionDesc'), h('span', { class: 'chip', style: 'font-size:var(--t-13)', text: t('days90') })));
  const exportIt = () => {
    const payload = { format: 'dwell-export', version: 1, exported: dayKey(TODAY_DATE), settings: s, days: S.deleted ? [] : DB.map(d => ({ day: d.key, hours: d.hours, visits: d.visits, blocked: d.blocked })) };
    const json = JSON.stringify(payload), f = 'dwell-export-' + dayKey(TODAY_DATE) + '.json';
    try { const url = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = h('a', { href: url, download: f }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); } catch (e) { console.warn('Export download unavailable here', e); }
    S.notice.export = t('exported', { f, k: Math.round(json.length / 1024), n: payload.days.length }); render();
  };
  da.append(setRow(t('sExport'), t('sExportDesc'), h('button', { class: 'btn', onclick: exportIt }, t('exportBtn')), S.notice.export ? h('p', { class: 'notice', role: 'status', text: S.notice.export }) : null));
  const file = h('input', { type: 'file', accept: 'application/json,.json', id: 'import-file', class: 'sr' });
  file.addEventListener('change', () => {
    const fl = file.files[0]; if (!fl) return;
    const rd = new FileReader();
    rd.onload = () => { try { const j = JSON.parse(rd.result); S.notice.import = j.format === 'dwell-export' ? t('imported', { n: (j.days || []).length, f: fl.name }) : t('importBad', { f: fl.name }); } catch (e) { S.notice.import = t('importBad', { f: fl.name }); } render(); };
    rd.readAsText(fl);

  da.append(setRow(t('sImport'), t('sImportDesc'), [file, h('label', { class: 'btn', for: 'import-file', tabindex: 0, onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } } }, t('importBtn'))], S.notice.import ? h('p', { class: 'notice', role: 'status', text: S.notice.import }) : null));
  const recDays = S.deleted ? 0 : DB.filter((d, i) => agg(i).total > 0).length;
  const conf = S.confirmDelete ? h('div', { class: 'confirm', role: 'alertdialog', 'aria-label': t('sDelete') }, h('p', { text: t('deleteQ', { n: recDays }) }),
    h('button', { class: 'btn btn-ink', onclick: () => { S.deleted = true; S.confirmDelete = false; S.notice.del = t('deleted'); bump(); render(); } }, t('deleteYes')),
    h('button', { class: 'btn', onclick: () => { S.confirmDelete = false; render(); } }, t('deleteNo'))) : (S.notice.del ? h('p', { class: 'notice', role: 'status', text: S.notice.del }) : null);
  da.append(setRow(t('sDelete'), t('sDeleteDesc'), h('button', { class: 'btn', disabled: S.deleted || S.confirmDelete ? true : null, onclick: () => { S.confirmDelete = true; render(); } }, t('deleteBtn')), conf));
  const lg = grp('set-lang', 'sLang');
  lg.append(setRow(t('sLang'), null, segRadios(t('sLang'), [['en', 'English'], ['fr', 'Français']], S.lang, v => { S.lang = v; document.documentElement.lang = v; render(); })));
}

/* ================= Privacy ================= */

  const prose = h('article', { class: 'prose' }, h('h1', { text: t('pTitle') }), h('p', { class: 'lead', id: 'privacy-lead', text: t('pLead') }));
  prose.append(h('div', { class: 'kept' },
    h('div', {}, h('h2', { text: t('pKept') }), h('ul', {}, ...['k1', 'k2', 'k3', 'k4', 'k5'].map(k => h('li', { text: t(k) })))),
    h('div', {}, h('h2', { text: t('pNever') }), h('ul', {}, ...['n1', 'n2', 'n3', 'n4', 'n5'].map(k => h('li', { text: t(k) }))))));
  prose.append(h('h2', { text: t('pWhereT') }), h('p', { text: t('pWhere') }), h('h2', { text: t('pNetT') }), h('p', {}, ...rich('pNet', { csp: h('code', { text: "connect-src 'none'" }) })));
  const perms = [['storage', 'perm_storage'], ['tabs', 'perm_tabs'], ['idle', 'perm_idle'], ['alarms', 'perm_alarms'], ['declarativeNetRequest', 'perm_dnr'], ['instagram.com, youtube.com, facebook.com', 'perm_hosts']];
  const side = h('aside', { class: 'panel' }, h('div', { class: 'panel-head' }, h('h2', { text: t('pPermT') })), h('p', { class: 'desc', style: 'color:var(--ink-2);font-size:var(--t-13);margin-bottom:var(--s-3)', text: t('pPermD') }),
    h('ul', { class: 'perm' }, ...perms.map(([c, k]) => h('li', {}, h('code', { text: c }), h('span', { text: t(k) })))));

/* ================= Stage + boot ================= */
const OMNI = { normal: 'instagram.com/', paused: 'instagram.com/', first: 'github.com/', untrackable: 'chrome://newtab', noblocker: 'github.com/' };
function applyTheme(v) { const r = document.documentElement; if (v === 'light' || v === 'dark') r.setAttribute('data-theme', v); else r.removeAttribute('data-theme'); S.theme = v || 'system'; }
function renderStage() {
  const bar = document.getElementById('stagebar'); bar.hidden = false;
  const seg = (label, opts, cur, fn) => h('div', { class: 'stage-group' }, h('span', { class: 'stage-label', text: label }), h('div', { class: 'seg' }, ...opts.map(([v, l]) => h('button', { 'aria-pressed': String(v === cur), onclick: () => fn(v) }, l))));
  bar.replaceChildren(...[
    seg('View', [['popup', 'Popup'], ['dashboard', 'Dashboard']], S.view, v => { S.view = v; render(); }),
    S.view === 'popup' ? seg('State', [['normal', 'Normal'], ['first', 'First run'], ['paused', 'Paused'], ['untrackable', 'Not trackable'], ['noblocker', 'No blocker']], S.pstate, v => { S.pstate = v; S.settings.paused = v === 'paused'; render(); }) : null,
    seg('Theme', [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']], S.theme, v => { applyTheme(v); render(); }),
    h('div', { class: 'stage-group stage-seed' }, h('span', { class: 'stage-label', text: 'Seed' }), h('span', { class: 'mono', text: String(S.seed) }),
      h('button', { class: 'btn', style: 'padding:2px 8px;font-size:var(--t-12)', onclick: () => { S.seed = (S.seed * 48271 + 11) % 2147483647; DB = generate(S.seed); S.deleted = false; S.notice = {}; bump(); render(); } }, 'Reseed'))].filter(Boolean));
}
function render() {
  const app = document.getElementById('app');
  const sx = window.scrollX, sy = window.scrollY, focusId = document.activeElement && document.activeElement.id;
  if (!BOOT.artboard) renderStage();
  if (S.view === 'popup') {
    const pop = renderPopup();
    if (BOOT.artboard) app.replaceChildren(pop);
    else {
      const ext = h('button', { class: 'ext-btn', 'aria-label': 'Dwell' }, glyph());
      app.replaceChildren(h('div', { class: 'stage' }, h('div', { class: 'browser' }, h('div', { class: 'toolbar' }, h('div', { class: 'omnibox', text: OMNI[S.pstate] }), ext), h('div', { class: 'popup-anchor' }, pop))));
    }
  } else app.replaceChildren(renderDashboard());
  window.scrollTo(sx, sy);
  if (focusId) { const f = document.getElementById(focusId); if (f) f.focus(); }
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { document.querySelectorAll('[data-chart]').forEach(c => { if (c.dataset.chart === 'week') drawWeekChart(c, S.week); else drawDayChart(c, S.day); }); }, 80); });
applyTheme(BOOT.theme);
(function deepLink() {
  const parts = (location.hash || '').slice(1).split('+'), hsh = parts[0];
  if (BOOT.artboard || !location.hash) return;
  if (parts.includes('dark') || parts.includes('light')) applyTheme(parts.includes('dark') ? 'dark' : 'light');
  if (parts.includes('fr')) S.lang = 'fr';
  if (['dashboard', 'settings', 'privacy', 'day'].includes(hsh)) { S.view = 'dashboard'; if (hsh === 'settings' || hsh === 'privacy') S.tab = hsh; if (hsh === 'day') S.day = TODAY - 1; }
  if (['normal', 'first', 'paused', 'untrackable', 'noblocker'].includes(hsh)) { S.pstate = hsh; S.settings.paused = hsh === 'paused'; }
})();
if (BOOT.artboard) document.body.classList.add('artboard');
if (BOOT.dash === 'day') S.day = TODAY - 1;
document.documentElement.lang = S.lang;
render();
